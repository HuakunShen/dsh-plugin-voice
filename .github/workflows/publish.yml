# Publishes @huakunshen/dsh-plugin-voice to the npm registry through npm
# Trusted Publishing: the OIDC token minted by GitHub Actions identifies this
# repository against the trusted publisher configured on npmjs.com, so no npm
# token secret is needed. Requires `permissions.id-token: write`.
#
# Triggers: a GitHub Release marked as published, or a manual run
# (Actions → publish → Run workflow) to republish or publish the first version.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Publish
        run: npm publish --access public
        env:
          # The publish command verifies the working tree matches the package
          # name; the version comes from package.json as usual.
          NPM_CONFIG_PROVENANCE: true
